[package]
name = "supertonic-reader"
version = "0.1.0"
description = "A TTS desktop app powered by Supertonic"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
dirs = "5.0"
opener = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
thiserror = "2"
anyhow = "1"
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs", "directml"] }
ndarray = "0.17"
hound = "3.5"
rand = "0.8"
rand_distr = "0.4"
regex = "1.11"
unicode-normalization = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
